<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Management - Smart Bus System</title>
  <!-- SEO & Styles -->
  <meta name="description" content="Manage bus fleet registry, capacity layouts, driver assignments, and status details.">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- Layout Shell (Sidebar & Header Injected Here) -->
  <div id="layout-wrapper" class="app-container">
    <main class="main-content">
      
      <!-- Filter and Add Row -->
      <section class="filter-bar animate-fade-in-up">
        <div class="search-input-wrapper">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="bus-search" placeholder="Search by number, driver, or type...">
        </div>
        
        <div class="filter-controls">
          <select id="bus-filter-status" class="filter-select">
            <option value="">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
          
          <button class="btn btn-primary" onclick="openAddBusModal()">
            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Add Bus
          </button>
        </div>
      </section>

      <!-- Main Fleet Table -->
      <section class="card-block animate-fade-in-up" style="animation-delay: 0.15s;">
        <div class="card-block-title">Bus Fleet Directory</div>
        
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Bus Number</th>
                <th>Driver Name</th>
                <th>Driver Contact</th>
                <th>Capacity</th>
                <th>Bus Type</th>
                <th>Status</th>
                <th style="text-align: right; padding-right: 24px;">Actions</th>
              </tr>
            </thead>
            <tbody id="buses-table-body">
              <tr>
                <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">
                  Loading fleet data...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- ==========================================================================
     Add Bus Modal Form (Floating Labels)
     ========================================================================== -->
  <div class="modal-overlay" id="add-bus-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Add New Bus</h3>
        <button class="modal-close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
        </button>
      </div>
      
      <form id="add-bus-form">
        <div class="modal-body">
          <div class="alert alert-danger" id="add-bus-error" style="display: none;"></div>
          
          <div class="form-group">
            <input type="text" id="add-bus-number" class="form-control" placeholder=" " required>
            <label class="form-label" for="add-bus-number">Bus Number (Registration)</label>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <input type="text" id="add-driver-name" class="form-control" placeholder=" " required>
              <label class="form-label" for="add-driver-name">Driver Name</label>
            </div>
            <div class="form-group">
              <input type="tel" id="add-driver-contact" class="form-control" placeholder=" " required>
              <label class="form-label" for="add-driver-contact">Driver Contact</label>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <input type="number" id="add-capacity" class="form-control" placeholder=" " min="1" required>
              <label class="form-label" for="add-capacity">Seating Capacity</label>
            </div>
            
            <div class="form-group form-group-static">
              <label class="form-label" for="add-bus-type">Bus Comfort Class</label>
              <select id="add-bus-type" class="form-control" required>
                <option value="AC Seater">AC Seater</option>
                <option value="Non-AC Seater">Non-AC Seater</option>
                <option value="AC Sleeper">AC Sleeper</option>
                <option value="Non-AC Sleeper">Non-AC Sleeper</option>
              </select>
            </div>
          </div>

          <div class="form-group form-group-static">
            <label class="form-label" for="add-status">Operational Status</label>
            <select id="add-status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="add-submit-btn">Save Bus</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==========================================================================
     Edit Bus Modal Form (Floating Labels)
     ========================================================================== -->
  <div class="modal-overlay" id="edit-bus-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Edit Bus Details</h3>
        <button class="modal-close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
        </button>
      </div>
      
      <form id="edit-bus-form">
        <input type="hidden" id="edit-bus-id">
        <div class="modal-body">
          <div class="alert alert-danger" id="edit-bus-error" style="display: none;"></div>
          
          <div class="form-group">
            <input type="text" id="edit-bus-number" class="form-control" placeholder=" " required>
            <label class="form-label" for="edit-bus-number">Bus Number (Registration)</label>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <input type="text" id="edit-driver-name" class="form-control" placeholder=" " required>
              <label class="form-label" for="edit-driver-name">Driver Name</label>
            </div>
            <div class="form-group">
              <input type="tel" id="edit-driver-contact" class="form-control" placeholder=" " required>
              <label class="form-label" for="edit-driver-contact">Driver Contact</label>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <input type="number" id="edit-capacity" class="form-control" placeholder=" " min="1" required>
              <label class="form-label" for="edit-capacity">Seating Capacity</label>
            </div>
            
            <div class="form-group form-group-static">
              <label class="form-label" for="edit-bus-type">Bus Comfort Class</label>
              <select id="edit-bus-type" class="form-control" required>
                <option value="AC Seater">AC Seater</option>
                <option value="Non-AC Seater">Non-AC Seater</option>
                <option value="AC Sleeper">AC Sleeper</option>
                <option value="Non-AC Sleeper">Non-AC Sleeper</option>
              </select>
            </div>
          </div>

          <div class="form-group form-group-static">
            <label class="form-label" for="edit-status">Operational Status</label>
            <select id="edit-status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="edit-submit-btn">Update Details</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    let busesList = [];

    // Initialize list load
    async function loadBusesList() {
      const tableBody = document.getElementById('buses-table-body');
      const searchQuery = document.getElementById('bus-search').value.trim();
      const statusFilter = document.getElementById('bus-filter-status').value;

      let endpoint = '/buses';
      const params = [];
      if (searchQuery) params.push(`search=${encodeURIComponent(searchQuery)}`);
      if (statusFilter) params.push(`status=${encodeURIComponent(statusFilter)}`);
      if (params.length > 0) endpoint += `?${params.join('&')}`;

      try {
        const data = await apiFetch(endpoint);
        
        if (data.success) {
          busesList = data.buses;
          
          if (busesList.length === 0) {
            tableBody.innerHTML = `
              <tr>
                <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">
                  No buses registered matching the filters.
                </td>
              </tr>
            `;
            return;
          }

          tableBody.innerHTML = busesList.map(bus => {
            const badgeClass = bus.Status === 'Active' ? 'badge-active' : 'badge-inactive';
            
            return `
              <tr>
                <td style="font-weight: 700; color: var(--sidebar-color);">${bus.BusNumber}</td>
                <td>${bus.DriverName}</td>
                <td>${bus.DriverContact}</td>
                <td style="font-weight: 600;">${bus.Capacity} seats</td>
                <td><span style="font-size: 0.8rem; font-weight: 600; background-color: var(--primary-light); color: var(--primary-color); padding: 4px 10px; border-radius: var(--radius-sm);">${bus.BusType}</span></td>
                <td><span class="badge ${badgeClass}">${bus.Status}</span></td>
                <td style="text-align: right; padding-right: 12px;">
                  <button class="btn-icon btn-icon-edit" onclick="openEditBusModal(${bus.BusID})" title="Edit Details">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                  </button>
                  <button class="btn-icon btn-icon-delete" onclick="handleDeleteBus(${bus.BusID}, '${bus.BusNumber}')" title="Remove Bus">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                  </button>
                </td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: var(--danger-color); font-weight: 600;">
              Error loading fleet data from server.
            </td>
          </tr>
        `;
      }
    }

    // Modal Control wrappers
    function openAddBusModal() {
      document.getElementById('add-bus-form').reset();
      document.getElementById('add-bus-error').style.display = 'none';
      openModal('add-bus-modal');
    }

    function openEditBusModal(busId) {
      const bus = busesList.find(b => b.BusID === busId);
      if (!bus) return;

      document.getElementById('edit-bus-error').style.display = 'none';
      document.getElementById('edit-bus-id').value = bus.BusID;
      document.getElementById('edit-bus-number').value = bus.BusNumber;
      document.getElementById('edit-driver-name').value = bus.DriverName;
      document.getElementById('edit-driver-contact').value = bus.DriverContact;
      document.getElementById('edit-capacity').value = bus.Capacity;
      document.getElementById('edit-bus-type').value = bus.BusType;
      document.getElementById('edit-status').value = bus.Status;

      openModal('edit-bus-modal');
    }

    // Handlers for Add Submit
    document.getElementById('add-bus-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        busNumber: document.getElementById('add-bus-number').value.trim(),
        driverName: document.getElementById('add-driver-name').value.trim(),
        driverContact: document.getElementById('add-driver-contact').value.trim(),
        capacity: parseInt(document.getElementById('add-capacity').value, 10),
        busType: document.getElementById('add-bus-type').value,
        status: document.getElementById('add-status').value
      };

      const errorBanner = document.getElementById('add-bus-error');
      const submitBtn = document.getElementById('add-submit-btn');
      
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      
      try {
        const response = await apiFetch('/buses', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        if (response.success) {
          closeModal('add-bus-modal');
          loadBusesList();
        }
      } catch (err) {
        errorBanner.innerText = err.message || 'Error occurred while saving.';
        errorBanner.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Handlers for Edit Submit
    document.getElementById('edit-bus-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const busId = document.getElementById('edit-bus-id').value;
      const payload = {
        busNumber: document.getElementById('edit-bus-number').value.trim(),
        driverName: document.getElementById('edit-driver-name').value.trim(),
        driverContact: document.getElementById('edit-driver-contact').value.trim(),
        capacity: parseInt(document.getElementById('edit-capacity').value, 10),
        busType: document.getElementById('edit-bus-type').value,
        status: document.getElementById('edit-status').value
      };

      const errorBanner = document.getElementById('edit-bus-error');
      const submitBtn = document.getElementById('edit-submit-btn');
      
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      
      try {
        const response = await apiFetch(`/buses/${busId}`, {
          method: 'PUT',
          body: JSON.stringify(payload)
        });

        if (response.success) {
          closeModal('edit-bus-modal');
          loadBusesList();
        }
      } catch (err) {
        errorBanner.innerText = err.message || 'Error occurred while updating.';
        errorBanner.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Handle delete action
    async function handleDeleteBus(busId, busNumber) {
      const confirmDelete = confirm(`Are you sure you want to delete Bus ${busNumber}?\nWarning: This will also remove any schedules linked to this bus.`);
      if (!confirmDelete) return;

      try {
        const response = await apiFetch(`/buses/${busId}`, {
          method: 'DELETE'
        });

        if (response.success) {
          loadBusesList();
        }
      } catch (err) {
        alert(err.message || 'Failed to delete bus.');
      }
    }

    // Attach search and filter event listeners
    document.getElementById('bus-search').addEventListener('input', debounce(loadBusesList, 300));
    document.getElementById('bus-filter-status').addEventListener('change', loadBusesList);

    // Debounce function
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // Initial load
    loadBusesList();
  </script>
</body>
</html>
