<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Smart Bus System</title>
  <!-- SEO & Styles -->
  <meta name="description" content="Admin Dashboard overview for Smart Bus Scheduling and Fleet Management. Check real-time KPIs and recent activity logs.">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- Layout Wrapper (Injected Sidebar & Top Header will render here) -->
  <div id="layout-wrapper" class="app-container">
    <main class="main-content">
      <!-- top-header will be injected here -->
      
      <!-- Stats KPIs Grid -->
      <section class="stats-grid animate-fade-in-up">
        
        <!-- Total Buses -->
        <div class="stat-card">
          <div class="stat-details">
            <span class="stat-title">Total Buses</span>
            <span class="stat-value" id="stat-buses-total">0</span>
          </div>
          <div class="stat-icon-wrapper icon-blue">
            <svg viewBox="0 0 24 24"><path d="M18 11H6V6h12m-1.5 11a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5M9.5 17a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.78c.61-.55 1-1.34 1-2.22V9a7 7 0 0 0-14 0v7z"/></svg>
          </div>
        </div>

        <!-- Total Routes -->
        <div class="stat-card">
          <div class="stat-details">
            <span class="stat-title">Total Routes</span>
            <span class="stat-value" id="stat-routes-total">0</span>
          </div>
          <div class="stat-icon-wrapper icon-green">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          </div>
        </div>

        <!-- Total Schedules -->
        <div class="stat-card">
          <div class="stat-details">
            <span class="stat-title">Total Schedules</span>
            <span class="stat-value" id="stat-schedules-total">0</span>
          </div>
          <div class="stat-icon-wrapper icon-yellow">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
          </div>
        </div>

        <!-- Today's Trips -->
        <div class="stat-card">
          <div class="stat-details">
            <span class="stat-title">Today's Trips</span>
            <span class="stat-value" id="stat-trips-today">0</span>
          </div>
          <div class="stat-icon-wrapper icon-blue" style="background-color: var(--primary-light); color: var(--primary-color);">
            <svg viewBox="0 0 24 24"><path d="M5 13h14v-2H5v2zm-2 4h14v-2H3v2zM5 9h14V7H5v2zm0-4v2h14V5H5z"/></svg>
          </div>
        </div>

        <!-- Total Drivers -->
        <div class="stat-card">
          <div class="stat-details">
            <span class="stat-title">Active Drivers</span>
            <span class="stat-value" id="stat-drivers-total">0</span>
          </div>
          <div class="stat-icon-wrapper icon-red">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
        </div>

      </section>

      <!-- Dashboard Visual Row -->
      <div class="dashboard-row animate-fade-in-up" style="animation-delay: 0.15s;">
        
        <!-- Fleet Utilization Visualization -->
        <div class="card-block">
          <div class="card-block-title">Fleet Allocation Chart</div>
          
          <div style="display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 40px; padding: 20px 0;">
            <!-- Custom SVG Donut Gauge -->
            <div style="position: relative; width: 190px; height: 190px;">
              <svg viewBox="0 0 36 36" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                <circle cx="18" cy="18" r="15.915" fill="none" stroke="#e2e8f0" stroke-width="2.5"></circle>
                <circle id="chart-active-segment" cx="18" cy="18" r="15.915" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="0 100" stroke-dashoffset="0" style="transition: stroke-dasharray 1.2s cubic-bezier(0.4, 0, 0.2, 1);"></circle>
              </svg>
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
                <span id="chart-percentage-label" style="font-size: 2.2rem; font-weight: 800; color: var(--text-main); letter-spacing: -1px;">0%</span>
                <p style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px;">Active Fleet</p>
              </div>
            </div>

            <!-- Chart Legends -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
              <div style="display: flex; align-items: center; gap: 14px;">
                <div style="width: 16px; height: 16px; border-radius: 4px; background-color: var(--primary-color); box-shadow: 0 2px 6px rgba(37,99,235,0.3);"></div>
                <div>
                  <span style="font-size: 0.95rem; font-weight: 700;" id="legend-active-buses">0 Active Buses</span>
                  <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 1px;">Allocated and running on routes</p>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 14px;">
                <div style="width: 16px; height: 16px; border-radius: 4px; background-color: #e2e8f0;"></div>
                <div>
                  <span style="font-size: 0.95rem; font-weight: 700;" id="legend-inactive-buses">0 Inactive Buses</span>
                  <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 1px;">Maintenance or standby status</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Activities Feed -->
        <div class="card-block">
          <div class="card-block-title">Recent System Activities</div>
          <div class="activity-feed" id="activities-container">
            <!-- Loading -->
            <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 40px;">
              Gathering activity logs...
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  
  <script>
    // Counter Animation Helper
    function animateCounter(elementId, targetValue) {
      const el = document.getElementById(elementId);
      if (!el) return;
      
      let start = 0;
      const duration = 1200; // ms
      const stepTime = Math.abs(Math.floor(duration / Math.max(targetValue, 1)));
      
      if (targetValue === 0) {
        el.innerText = 0;
        return;
      }
      
      const timer = setInterval(() => {
        start++;
        el.innerText = start;
        if (start >= targetValue) {
          clearInterval(timer);
          el.innerText = targetValue;
        }
      }, Math.max(stepTime, 16));
    }

    // Fetch and populate stats
    async function initDashboard() {
      try {
        const data = await apiFetch('/reports/dashboard-stats');
        
        if (data.success) {
          // 1. Trigger Counter animations
          animateCounter('stat-buses-total', data.stats.buses.total);
          animateCounter('stat-routes-total', data.stats.routes.total);
          animateCounter('stat-schedules-total', data.stats.schedules.total);
          animateCounter('stat-drivers-total', data.stats.drivers.total);
          animateCounter('stat-trips-today', data.stats.todaysTrips.total);

          // 2. Set up donut chart
          const totalBuses = data.stats.buses.total;
          const activeBuses = data.stats.buses.active;
          const inactiveBuses = data.stats.buses.inactive;
          
          document.getElementById('legend-active-buses').innerText = `${activeBuses} Active Buses`;
          document.getElementById('legend-inactive-buses').innerText = `${inactiveBuses} Inactive Buses`;

          const activePercentage = totalBuses > 0 ? Math.round((activeBuses / totalBuses) * 100) : 0;
          
          // Update SVG segment dash-array
          const activeSegment = document.getElementById('chart-active-segment');
          activeSegment.setAttribute('stroke-dasharray', `${activePercentage} 100`);
          
          // Animate percentage text
          let currentPct = 0;
          const pctInterval = setInterval(() => {
            if (currentPct >= activePercentage) {
              clearInterval(pctInterval);
              document.getElementById('chart-percentage-label').innerText = `${activePercentage}%`;
            } else {
              currentPct++;
              document.getElementById('chart-percentage-label').innerText = `${currentPct}%`;
            }
          }, 12);

          // 3. Render Activities
          renderActivities(data.recentActivities);
        }
      } catch (err) {
        console.error('Failed to init dashboard stats', err);
      }
    }

    function renderActivities(activities) {
      const container = document.getElementById('activities-container');
      
      if (!activities || activities.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">No recent activity logs.</div>';
        return;
      }

      container.innerHTML = activities.map(act => {
        let iconColorClass = 'icon-blue';
        let svgIcon = '';

        if (act.type === 'bus') {
          iconColorClass = 'icon-blue';
          svgIcon = `<svg viewBox="0 0 24 24"><path d="M18 11H6V6h12m-1.5 11a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5M9.5 17a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.78c.61-.55 1-1.34 1-2.22V9a7 7 0 0 0-14 0v7z"/></svg>`;
        } else if (act.type === 'route') {
          iconColorClass = 'icon-green';
          svgIcon = `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>`;
        } else if (act.type === 'schedule') {
          iconColorClass = 'icon-yellow';
          svgIcon = `<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>`;
        }

        return `
          <div class="activity-item">
            <div class="activity-badge ${iconColorClass}">
              ${svgIcon}
            </div>
            <div class="activity-details">
              <span class="activity-title">${act.title}</span>
              <span class="activity-desc">${act.description}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Initialize
    initDashboard();
  </script>
</body>
</html>
