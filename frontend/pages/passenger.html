<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Portal - Smart Bus Scheduling System</title>
  <!-- SEO & Styling -->
  <meta name="description" content="View active bus schedules, search by source/destination stations, and check real-time timetables on the Smart Bus Passenger Portal.">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body style="background-color: var(--bg-color);">

  <!-- Passenger Top Navigation Bar -->
  <nav class="passenger-navbar">
    <div class="passenger-brand">
      <svg viewBox="0 0 24 24">
        <path d="M18 11H6V6h12m-1.5 11a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5M9.5 17a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.78c.61-.55 1-1.34 1-2.22V9a7 7 0 0 0-14 0v7z"/>
      </svg>
      <h1>Smart Bus</h1>
    </div>
    <div>
      <a href="login.html" class="btn btn-secondary" style="font-weight: 600;">Admin Console &rarr;</a>
    </div>
  </nav>

  <div class="passenger-wrapper">

    <!-- Search Timetable Widget -->
    <section class="passenger-search-panel animate-fade-in-up">
      <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 24px; color: var(--text-main); letter-spacing: -0.5px;">Search Bus Timetable</h2>
      <form id="search-form">
        <div class="passenger-search-grid">
          
          <div class="passenger-search-field">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            <input 
              type="text" 
              id="search-source" 
              class="form-control" 
              placeholder="Source Location (e.g. Majestic)"
            >
          </div>

          <div class="passenger-search-field">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            <input 
              type="text" 
              id="search-destination" 
              class="form-control" 
              placeholder="Destination Location"
            >
          </div>

          <div class="search-widget-btn-wrapper">
            <button type="submit" class="btn btn-primary" style="width: 100%; height: 50px;">Search Buses</button>
          </div>

        </div>
      </form>
    </section>

    <!-- Results Display -->
    <main class="animate-fade-in-up" style="animation-delay: 0.15s;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px;" id="results-count-title">Active Bus Schedules</h2>
        <button class="btn btn-secondary" style="padding: 6px 16px; font-size: 0.8rem;" id="clear-search-btn">Reset Filters</button>
      </div>

      <div class="schedule-results" id="schedule-results-container">
        <!-- Loader -->
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          Searching active buses...
        </div>
      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script>
    // Fetch and display schedules
    async function loadSchedules(source = '', destination = '') {
      const resultsContainer = document.getElementById('schedule-results-container');
      const countTitle = document.getElementById('results-count-title');
      
      resultsContainer.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-muted);">Searching active buses...</div>';

      try {
        // Query active schedules
        let endpoint = '/schedules?status=Active';
        if (source) endpoint += `&source=${encodeURIComponent(source)}`;
        if (destination) endpoint += `&destination=${encodeURIComponent(destination)}`;

        const data = await apiFetch(endpoint);
        
        if (data.success && data.schedules.length > 0) {
          countTitle.innerText = `${data.schedules.length} Active Bus Schedule(s) Found`;
          
          resultsContainer.innerHTML = data.schedules.map(sched => {
            const depTime = sched.departureTime.substring(0, 5);
            const arrTime = sched.arrivalTime.substring(0, 5);

            return `
              <div class="journey-card">
                
                <!-- Departure -> Distance -> Destination Flow -->
                <div class="journey-flow">
                  <div class="journey-station">
                    <span class="journey-time">${depTime}</span>
                    <span class="journey-station-name">${sched.route.source}</span>
                  </div>
                  
                  <div class="journey-line-wrapper">
                    <span class="journey-distance">${sched.route.distance} km</span>
                    <div class="journey-line"></div>
                  </div>
                  
                  <div class="journey-station">
                    <span class="journey-time">${arrTime}</span>
                    <span class="journey-station-name">${sched.route.destination}</span>
                  </div>
                </div>

                <!-- Bus Fleet Info -->
                <div class="journey-bus-detail">
                  <div class="journey-bus-avatar">
                    <svg viewBox="0 0 24 24"><path d="M18 11H6V6h12m-1.5 11a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5M9.5 17a1.5 1.5 0 1 1-1.5-1.5 1.5 1.5 0 0 1 1.5 1.5M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.78c.61-.55 1-1.34 1-2.22V9a7 7 0 0 0-14 0v7z"/></svg>
                  </div>
                  <div>
                    <span class="journey-bus-number">${sched.bus.busNumber}</span>
                    <p class="journey-bus-driver">Driver: ${sched.bus.driverName}</p>
                    <span class="journey-bus-type">${sched.bus.busType}</span>
                  </div>
                </div>

                <!-- Info panel -->
                <div class="journey-info-panel">
                  <span class="journey-capacity">${sched.bus.capacity} seats</span>
                  <span class="journey-driver-contact">Tel: ${sched.bus.driverContact}</span>
                </div>

              </div>
            `;
          }).join('');
        } else {
          countTitle.innerText = `0 Schedules Found`;
          resultsContainer.innerHTML = `
            <div class="no-results">
              <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
              </svg>
              <h3>No Schedules Found</h3>
              <p>We couldn't find any buses running between those locations right now. Try searching other stations.</p>
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
        countTitle.innerText = `Error`;
        resultsContainer.innerHTML = `
          <div class="no-results" style="color: var(--danger-color); border-color: rgba(239, 68, 68, 0.2);">
            <h3>Connection Error</h3>
            <p>Could not connect to the scheduling service. Make sure the backend server is running.</p>
          </div>
        `;
      }
    }

    // Submit handler
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const source = document.getElementById('search-source').value.trim();
      const destination = document.getElementById('search-destination').value.trim();
      loadSchedules(source, destination);
    });

    // Reset filters
    document.getElementById('clear-search-btn').addEventListener('click', () => {
      document.getElementById('search-source').value = '';
      document.getElementById('search-destination').value = '';
      loadSchedules();
    });

    // Initial load
    loadSchedules();
  </script>
</body>
</html>
