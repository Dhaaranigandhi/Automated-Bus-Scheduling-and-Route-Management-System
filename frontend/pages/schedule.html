<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Management - Smart Bus System</title>
  <!-- SEO & Styles -->
  <meta name="description" content="Manage bus schedules, assign active fleets to specific routes, and configure timetables.">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- Layout Shell (Sidebar & Header Injected Here) -->
  <div id="layout-wrapper" class="app-container">
    <main class="main-content">
      
      <!-- Filter and Add Row -->
      <section class="filter-bar animate-fade-in-up">
        <div style="display: flex; gap: 16px; flex-grow: 1; max-width: 500px;">
          <div class="search-input-wrapper">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="schedule-search-source" placeholder="Search by source...">
          </div>
          <div class="search-input-wrapper">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="schedule-search-dest" placeholder="Search by destination...">
          </div>
        </div>
        
        <div class="filter-controls">
          <select id="schedule-filter-status" class="filter-select">
            <option value="">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Completed">Completed</option>
          </select>
          
          <button class="btn btn-primary" onclick="openAddScheduleModal()">
            <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Add Schedule
          </button>
        </div>
      </section>

      <!-- Main Schedule Table -->
      <section class="card-block animate-fade-in-up" style="animation-delay: 0.15s;">
        <div class="card-block-title">Transit Schedules Directory</div>
        
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Bus Registration</th>
                <th>Driver & Contact</th>
                <th>Route Details</th>
                <th>Departure Time</th>
                <th>Arrival Time</th>
                <th>Status</th>
                <th style="text-align: right; padding-right: 24px;">Actions</th>
              </tr>
            </thead>
            <tbody id="schedules-table-body">
              <tr>
                <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">
                  Loading schedule timetable data...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- ==========================================================================
     Add Schedule Modal Form
     ========================================================================== -->
  <div class="modal-overlay" id="add-schedule-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Create New Schedule</h3>
        <button class="modal-close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
        </button>
      </div>
      
      <form id="add-schedule-form">
        <div class="modal-body">
          <div class="alert alert-danger" id="add-schedule-error" style="display: none;"></div>
          
          <div class="form-group form-group-static">
            <label class="form-label" for="add-select-bus">Assign Bus Fleet</label>
            <select id="add-select-bus" class="form-control" required>
              <option value="">-- Choose Bus --</option>
            </select>
          </div>

          <div class="form-group form-group-static">
            <label class="form-label" for="add-select-route">Assign Transit Route</label>
            <select id="add-select-route" class="form-control" required>
              <option value="">-- Choose Route --</option>
            </select>
          </div>
          
          <div class="form-row">
            <div class="form-group form-group-static">
              <label class="form-label" for="add-dep-time">Departure Time</label>
              <input type="time" id="add-dep-time" class="form-control" required>
            </div>
            <div class="form-group form-group-static">
              <label class="form-label" for="add-arr-time">Arrival Time</label>
              <input type="time" id="add-arr-time" class="form-control" required>
            </div>
          </div>

          <div class="form-group form-group-static">
            <label class="form-label" for="add-status">Schedule Status</label>
            <select id="add-status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Pending">Pending</option>
              <option value="Cancelled">Cancelled</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="add-submit-btn">Save Schedule</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==========================================================================
     Edit Schedule Modal Form
     ========================================================================== -->
  <div class="modal-overlay" id="edit-schedule-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Edit Schedule Details</h3>
        <button class="modal-close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
        </button>
      </div>
      
      <form id="edit-schedule-form">
        <input type="hidden" id="edit-schedule-id">
        <div class="modal-body">
          <div class="alert alert-danger" id="edit-schedule-error" style="display: none;"></div>
          
          <div class="form-group form-group-static">
            <label class="form-label" for="edit-select-bus">Assign Bus Fleet</label>
            <select id="edit-select-bus" class="form-control" required>
              <option value="">-- Choose Bus --</option>
            </select>
          </div>

          <div class="form-group form-group-static">
            <label class="form-label" for="edit-select-route">Assign Transit Route</label>
            <select id="edit-select-route" class="form-control" required>
              <option value="">-- Choose Route --</option>
            </select>
          </div>
          
          <div class="form-row">
            <div class="form-group form-group-static">
              <label class="form-label" for="edit-dep-time">Departure Time</label>
              <input type="time" id="edit-dep-time" class="form-control" required>
            </div>
            <div class="form-group form-group-static">
              <label class="form-label" for="edit-arr-time">Arrival Time</label>
              <input type="time" id="edit-arr-time" class="form-control" required>
            </div>
          </div>

          <div class="form-group form-group-static">
            <label class="form-label" for="edit-status">Schedule Status</label>
            <select id="edit-status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Pending">Pending</option>
              <option value="Cancelled">Cancelled</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="edit-submit-btn">Update Details</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>

  <script>
    let schedulesList = [];
    let busesCache = [];
    let routesCache = [];

    // Helper to fetch and cache buses and routes for dropdown populations
    async function loadSelectOptions() {
      try {
        const busesData = await apiFetch('/buses');
        if (busesData.success) {
          busesCache = busesData.buses;
          populateBusSelects();
        }

        const routesData = await apiFetch('/routes');
        if (routesData.success) {
          routesCache = routesData.routes;
          populateRouteSelects();
        }
      } catch (err) {
        console.error('Failed to load selection options', err);
      }
    }

    function populateBusSelects() {
      const addSelect = document.getElementById('add-select-bus');
      const editSelect = document.getElementById('edit-select-bus');

      const optionsHtml = busesCache.map(b => 
        `<option value="${b.BusID}">${b.BusNumber} (${b.DriverName} - ${b.Status})</option>`
      ).join('');

      addSelect.innerHTML = `<option value="">-- Choose Bus --</option>` + optionsHtml;
      editSelect.innerHTML = `<option value="">-- Choose Bus --</option>` + optionsHtml;
    }

    function populateRouteSelects() {
      const addSelect = document.getElementById('add-select-route');
      const editSelect = document.getElementById('edit-select-route');

      const optionsHtml = routesCache.map(r => 
        `<option value="${r.RouteID}">${r.Source} &rarr; ${r.Destination} (${r.Distance} km)</option>`
      ).join('');

      addSelect.innerHTML = `<option value="">-- Choose Route --</option>` + optionsHtml;
      editSelect.innerHTML = `<option value="">-- Choose Route --</option>` + optionsHtml;
    }

    // Initialize list load
    async function loadSchedulesList() {
      const tableBody = document.getElementById('schedules-table-body');
      const sourceQuery = document.getElementById('schedule-search-source').value.trim();
      const destQuery = document.getElementById('schedule-search-dest').value.trim();
      const statusFilter = document.getElementById('schedule-filter-status').value;

      let endpoint = '/schedules';
      const params = [];
      if (sourceQuery) params.push(`source=${encodeURIComponent(sourceQuery)}`);
      if (destQuery) params.push(`destination=${encodeURIComponent(destQuery)}`);
      if (statusFilter) params.push(`status=${encodeURIComponent(statusFilter)}`);
      if (params.length > 0) endpoint += `?${params.join('&')}`;

      try {
        const data = await apiFetch(endpoint);
        
        if (data.success) {
          schedulesList = data.schedules;
          
          if (schedulesList.length === 0) {
            tableBody.innerHTML = `
              <tr>
                <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">
                  No schedules defined matching the filters.
                </td>
              </tr>
            `;
            return;
          }

          tableBody.innerHTML = schedulesList.map(item => {
            let badgeClass = 'badge-active';
            if (item.status === 'Active') badgeClass = 'badge-active';
            else if (item.status === 'Pending') badgeClass = 'badge-pending';
            else if (item.status === 'Cancelled') badgeClass = 'badge-cancelled';
            else if (item.status === 'Completed') badgeClass = 'badge-completed';

            const depTime = item.departureTime.substring(0, 5);
            const arrTime = item.arrivalTime.substring(0, 5);

            return `
              <tr>
                <td style="font-weight: 700; color: var(--sidebar-color);">${item.bus.busNumber}</td>
                <td>
                  <span style="font-weight: 600;">${item.bus.driverName}</span>
                  <p style="font-size: 0.75rem; color: var(--text-muted);">${item.bus.driverContact}</p>
                </td>
                <td>
                  <span style="font-weight: 600;">${item.route.source} &rarr; ${item.route.destination}</span>
                  <p style="font-size: 0.75rem; color: var(--primary-color); font-weight: 600;">Distance: ${item.route.distance} km</p>
                </td>
                <td style="font-weight: 700; color: var(--text-main);">${depTime}</td>
                <td style="font-weight: 700; color: var(--text-main);">${arrTime}</td>
                <td><span class="badge ${badgeClass}">${item.status}</span></td>
                <td style="text-align: right; padding-right: 12px;">
                  <button class="btn-icon btn-icon-edit" onclick="openEditScheduleModal(${item.scheduleId})" title="Edit Details">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                  </button>
                  <button class="btn-icon btn-icon-delete" onclick="handleDeleteSchedule(${item.scheduleId})" title="Remove Schedule">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                  </button>
                </td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: var(--danger-color); font-weight: 600;">
              Error loading schedule database from server.
            </td>
          </tr>
        `;
      }
    }

    // Modal Control wrappers
    function openAddScheduleModal() {
      document.getElementById('add-schedule-form').reset();
      document.getElementById('add-schedule-error').style.display = 'none';
      openModal('add-schedule-modal');
    }

    function openEditScheduleModal(scheduleId) {
      const item = schedulesList.find(s => s.scheduleId === scheduleId);
      if (!item) return;

      document.getElementById('edit-schedule-error').style.display = 'none';
      document.getElementById('edit-schedule-id').value = item.scheduleId;
      document.getElementById('edit-select-bus').value = item.bus.busId;
      document.getElementById('edit-select-route').value = item.route.routeId;
      document.getElementById('edit-dep-time').value = item.departureTime.substring(0, 5);
      document.getElementById('edit-arr-time').value = item.arrivalTime.substring(0, 5);
      document.getElementById('edit-status').value = item.status;

      openModal('edit-schedule-modal');
    }

    // Handlers for Add Submit
    document.getElementById('add-schedule-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        busId: parseInt(document.getElementById('add-select-bus').value, 10),
        routeId: parseInt(document.getElementById('add-select-route').value, 10),
        departureTime: document.getElementById('add-dep-time').value + ':00',
        arrivalTime: document.getElementById('add-arr-time').value + ':00',
        status: document.getElementById('add-status').value
      };

      const errorBanner = document.getElementById('add-schedule-error');
      const submitBtn = document.getElementById('add-submit-btn');
      
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      
      try {
        const response = await apiFetch('/schedules', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        if (response.success) {
          closeModal('add-schedule-modal');
          loadSchedulesList();
        }
      } catch (err) {
        errorBanner.innerText = err.message || 'Error occurred while saving.';
        errorBanner.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Handlers for Edit Submit
    document.getElementById('edit-schedule-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const scheduleId = document.getElementById('edit-schedule-id').value;
      const payload = {
        busId: parseInt(document.getElementById('edit-select-bus').value, 10),
        routeId: parseInt(document.getElementById('edit-select-route').value, 10),
        departureTime: document.getElementById('edit-dep-time').value + ':00',
        arrivalTime: document.getElementById('edit-arr-time').value + ':00',
        status: document.getElementById('edit-status').value
      };

      const errorBanner = document.getElementById('edit-schedule-error');
      const submitBtn = document.getElementById('edit-submit-btn');
      
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      
      try {
        const response = await apiFetch(`/schedules/${scheduleId}`, {
          method: 'PUT',
          body: JSON.stringify(payload)
        });

        if (response.success) {
          closeModal('edit-schedule-modal');
          loadSchedulesList();
        }
      } catch (err) {
        errorBanner.innerText = err.message || 'Error occurred while updating.';
        errorBanner.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Handle delete action
    async function handleDeleteSchedule(scheduleId) {
      const confirmDelete = confirm('Are you sure you want to delete this schedule assignment?');
      if (!confirmDelete) return;

      try {
        const response = await apiFetch(`/schedules/${scheduleId}`, {
          method: 'DELETE'
        });

        if (response.success) {
          loadSchedulesList();
        }
      } catch (err) {
        alert(err.message || 'Failed to delete schedule.');
      }
    }

    // Attach search and filter events
    document.getElementById('schedule-search-source').addEventListener('input', debounce(loadSchedulesList, 300));
    document.getElementById('schedule-search-dest').addEventListener('input', debounce(loadSchedulesList, 300));
    document.getElementById('schedule-filter-status').addEventListener('change', loadSchedulesList);

    // Debounce helper
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // Initial sequence loads
    async function init() {
      await loadSelectOptions();
      await loadSchedulesList();
    }

    init();
  </script>
</body>
</html>
